name: Build and publish nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Publishing a moving tag must not overlap or be cancelled halfway through asset upload.
concurrency:
  group: attendance-nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check and build unsigned release APK
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --no-daemon
      - name: Upload rendered UI and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Attendance-ui-checks
          path: |
            app/build/reports/ui/*.png
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30
      - name: Test signing with disposable keys
        run: python3 .github/scripts/test-sign-nightly.py
      - name: Prepare unsigned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Attendance-nightly-unsigned.apk
      - name: Sign APK with user keystore
        if: github.ref == 'refs/heads/master'
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/sign-nightly.sh
      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          if [[ -f SIGNING-CERTIFICATE.txt ]]; then
            sha256sum SIGNING-CERTIFICATE.txt >> SHA256SUMS.txt
          fi
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Attendance-nightly
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout built commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download checked APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Attendance-nightly
          path: dist
      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_master=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            echo "Newer master commit exists; keep this run's artifact and skip publishing an older nightly."
            exit 0
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if [[ -f dist/Attendance-nightly.apk ]]; then
            signing_note="Attendance-nightly.apk 已使用用户提供的 keystore 签名并验证，可直接安装。SIGNING-CERTIFICATE.txt 为公开证书指纹。另附未签名 APK。"
          else
            signing_note="未配置签名 Secrets；当前仅提供未签名 APK，安装前需自行签名。"
          fi
          cat > nightly-notes.md <<EOF_NOTES
          自动构建自 master：[$GITHUB_SHA](https://github.com/$GH_REPO/commit/$GITHUB_SHA)

          已通过 Android lint、单元测试和 R8 Release 构建。
          $signing_note
          SHA256SUMS.txt 用于校验下载文件。
          nightly 为滚动预发布版本，不替代正式版本。
          EOF_NOTES
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            # Do not leave a signed APK from a previous commit on an unsigned-only release.
            if [[ ! -f dist/Attendance-nightly.apk ]]; then
              gh release view nightly --json assets --jq '.assets[].name' > existing-assets.txt
              for stale in Attendance-nightly.apk SIGNING-CERTIFICATE.txt; do
                if grep -Fxq "$stale" existing-assets.txt; then
                  gh release delete-asset nightly "$stale" --yes
                fi
              done
            fi
            gh release edit nightly --title "Attendance Nightly" --notes-file nightly-notes.md --prerelease --latest=false
          else
            gh release create nightly dist/* \
              --target "$GITHUB_SHA" --title "Attendance Nightly" --notes-file nightly-notes.md --prerelease --latest=false
          fi
